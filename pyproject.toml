[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "codex-context"
version = "0.1.0"
description = "Safe, compact repository context for Codex and Serena"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18,<0.19", "tomlkit>=0.13,<1", "pathspec>=0.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
codex-context = "codex_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real external Codex/Serena integration"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/codex_context"]
